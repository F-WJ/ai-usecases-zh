<style>
:root {
  --bg:#f6f7f9; --card:#fff; --text:#1a1d23; --muted:#5c6570; --border:#e2e6eb;
  --accent:#2563eb; --accent-soft:#dbeafe; --chip:#eef1f5; --shadow:0 1px 3px rgba(0,0,0,.06);
  --overlay:rgba(15,18,24,.45);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0f1218; --card:#1a1f2a; --text:#e8eaed; --muted:#9aa3b2; --border:#2a3140;
    --accent:#60a5fa; --accent-soft:#1e3a5f; --chip:#243044; --shadow:0 1px 3px rgba(0,0,0,.35);
    --overlay:rgba(0,0,0,.55);
  }
}
* { box-sizing:border-box; }
body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55; }
body.modal-open { overflow:hidden; }
header { position:sticky; top:0; z-index:10; background:var(--card); border-bottom:1px solid var(--border);
  padding:12px 16px; box-shadow:var(--shadow); }
header h1 { margin:0 0 4px; font-size:1.25rem; }
header p { margin:0; color:var(--muted); font-size:.9rem; }
.toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
input[type=search] { flex:1 1 220px; min-width:160px; padding:8px 12px; border:1px solid var(--border);
  border-radius:8px; background:var(--bg); color:var(--text); font-size:1rem; }
select { padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.chip { border:1px solid var(--border); background:var(--chip); color:var(--text); border-radius:999px;
  padding:5px 12px; cursor:pointer; font-size:.85rem; }
.chip span { color:var(--muted); margin-left:4px; }
.chip.active, .chip:hover { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
main { max-width:960px; margin:0 auto; padding:16px; }
.meta { color:var(--muted); font-size:.9rem; margin-bottom:12px; }
.grid { display:grid; gap:12px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow);
  cursor:pointer; transition: border-color .15s, box-shadow .15s; }
.card:hover, .card:focus-visible { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); outline:none; }
.card h2 { margin:0 0 6px; font-size:1.05rem; }
.card .en { color:var(--muted); font-size:.88rem; margin:0 0 8px; display:none; }
.card.show-en .en, .modal.show-en .en-block { display:block; }
.en-block { display:none; color:var(--muted); font-size:.9rem; margin:.35rem 0 .8rem; padding:.6rem .75rem; background:var(--bg); border-radius:8px; border:1px dashed var(--border); }
.badges { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.badge { background:var(--chip); border-radius:6px; padding:2px 8px; font-size:.78rem; color:var(--muted); }
.badge.cat { background:var(--accent-soft); color:var(--accent); }
.summary { margin:0 0 8px; }
.hint { color:var(--accent); font-size:.82rem; margin:0; }
.issue-line { color:var(--muted); font-size:.82rem; margin:0 0 8px; }
.links { display:flex; flex-wrap:wrap; gap:10px; font-size:.88rem; }
.links a { color:var(--accent); text-decoration:none; }
.links a:hover { text-decoration:underline; }
.banner { background:var(--accent-soft); color:var(--accent); padding:8px 12px; border-radius:8px; font-size:.9rem; margin-bottom:12px; }
footer { text-align:center; color:var(--muted); font-size:.8rem; padding:24px 16px 40px; }
/* Modal / drawer */
.backdrop { position:fixed; inset:0; background:var(--overlay); z-index:40; opacity:0; pointer-events:none; transition:opacity .18s; }
.backdrop.open { opacity:1; pointer-events:auto; }
.modal { position:fixed; z-index:50; top:0; right:0; height:100%; width:min(560px,100%); background:var(--card);
  border-left:1px solid var(--border); box-shadow:var(--shadow); transform:translateX(100%); transition:transform .2s ease;
  display:flex; flex-direction:column; }
.modal.open { transform:translateX(0); }
.modal-head { display:flex; align-items:flex-start; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); }
.modal-head h2 { margin:0; font-size:1.15rem; flex:1; }
.modal-body { padding:16px; overflow:auto; flex:1; }
.modal-body h3 { margin:1.1rem 0 .4rem; font-size:.95rem; color:var(--accent); }
.modal-body p, .modal-body pre { margin:0 0 .6rem; }
.modal-body pre { white-space:pre-wrap; word-break:break-word; background:var(--bg); border:1px solid var(--border);
  border-radius:8px; padding:10px 12px; font-family:inherit; font-size:.92rem; }
.close { border:none; background:var(--chip); color:var(--text); width:36px; height:36px; border-radius:8px; font-size:1.2rem; cursor:pointer; flex-shrink:0; }
.close:hover { background:var(--accent-soft); color:var(--accent); }
.modal-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:4px; }
.modal-actions label { font-size:.85rem; color:var(--muted); }
@media (max-width:560px) {
  .modal { width:100%; border-left:none; border-top:1px solid var(--border); top:auto; bottom:0; height:min(92vh,100%);
    border-radius:16px 16px 0 0; transform:translateY(100%); }
  .modal.open { transform:translateY(0); }
}
</style>

<script>
const DATA = [{"id": "coordinate-a-cancer-patient-s-records-and-care-with-an-agent","title": "Coordinate a cancer patient's records and care with an agent","title_zh": "用智能体协调癌症患者的病历与护理","summary": "A family gave a dying relative's medical records to an agent as coordinator; it flagged a wrong pain medication schedule and a transcription error in his genetic markers, which changed his treatment plan.","summary_zh": "一家人把临终亲人的病历交给智能体做协调；它标出止痛药用药计划有误，以及基因标记转录错误，从而改变了治疗方案。","what_they_did": "After the father-in-law was passed between many doctors and NPs and ended up on so many conflicting medications that he passed out, the commenter gave all his records to an agent and made it coordinator. Doctors and tests became inputs to it. It reviewed everything together and presented evidence for actions to his doctors.","what_they_did_zh": "岳父在多名医生和执业护士之间辗转，最终因多种冲突用药而昏倒后，留言者把全部病历交给智能体并让它担任协调者。医生与检查结果都作为输入。它把所有材料一并审阅，并向医生提供可采取行动的依据。","how_it_went": "It found a wrong pain medication and schedule, and a voice-transcription error in his genetic markers that changed his treatment plan. He felt better, but he had already lost too much weight and died of pancreatic cancer.","how_it_went_zh": "它发现止痛药种类与用药计划有误，以及基因标记中的语音转录错误，从而改变了治疗方案。他一度感觉好转，但体重已严重下降，最终因胰腺癌去世。","worth_knowing": "The commenter says they wish they had been far more aggressive sooner; the earlier the agent coordinates, the more it can help, since his reserves were already drained.","worth_knowing_zh": "留言者表示希望更早、更积极地介入；智能体越早开始协调帮助越大，因为他当时的身体储备已耗尽。","prompt": "I'm helping coordinate care for [relative's name], who has [condition]. I'll paste in their medication schedule, lab results, and notes from [doctors/clinics]. Build a single timeline, then flag anything that looks inconsistent: dosing or schedule conflicts, values that differ between documents, or likely transcription errors. Finish with a list of specific questions to bring to the care team, and remind me you're not a substitute for their clinicians.","prompt_zh": "我在协助协调 [亲属姓名] 的护理，他/她患有 [病情]。我会粘贴用药计划、化验结果以及 [医生/诊所] 的记录。请整理成一条时间线，并标出任何看起来不一致之处：剂量或用药计划冲突、文件间数值不符，或可能的转录错误。最后列出可带给护理团队的具体问题，并提醒我你不能替代临床医生。","category": "life","category_zh": "生活","tools": ["Claude"],"agents": ["Claude"],"link": "","source_url": "https://news.ycombinator.com/item?id=50100601","source_platform": "hn","source_platform_zh": "Hacker News","author": "","score": null,"date": "2026-10-17","addedAt": "2026-10-17","issue_date": "2026-10-17","issue_subject": "Catch a medication mistake and find $500 in unclaimed money","issue_subject_zh": "揪出用药错误，并找到 500 美元无人认领资金","accounts": null,"page": "https://agentusecases.ai/use-case/coordinate-a-cancer-patient-s-records-and-care-with-an-agent"},{"id": "find-unclaimed-money-across-old-addresses","title": "Find unclaimed money across old addresses","title_zh": "按旧地址查找无人认领资金","summary": "A user's AI agent searched prior addresses and found a further $500 in unclaimed money, then filled out forms and prepped ID checks.","summary_zh": "用户的 AI 智能体检索曾用地址，又发现 500 美元无人认领资金，并填写表格、准备身份核验材料。","what_they_did": "The agent received the user's list of old addresses. It searched unclaimed-money databases across them, locating an extra $500 plus US amounts from prior residence there. It then completed the claim forms and prepared the three-category ID verification documents.","what_they_did_zh": "智能体拿到用户的旧地址列表后，在各相关无人认领资金数据库中检索，额外找到 500 美元，以及此前在美国居住期间的款项。随后它填写了申领表格，并准备好三类身份核验文件。","how_it_went": "The agent reported the $500 discovery and finished filling forms plus ID prep. No shortfalls stated.","how_it_went_zh": "智能体报告发现了这 500 美元，并完成了表格填写与身份材料准备。未提及明显不足。","worth_knowing": "","worth_knowing_zh": "","prompt": "Search for unclaimed money or property in my name using these names and past addresses: [full name and any previous names], [list of past addresses and states]. Check each relevant state's official unclaimed property site and the national databases, and list anything found with the amount and holder. Before you fill out or submit any claim form or upload any ID, pause and show me what you are about to enter, and tell me which ID or verification documents I'll need to prepare.","prompt_zh": "请用这些姓名与过往地址查找以我名义登记的无人认领资金或财产：[全名及曾用名]、[过往地址与所在州列表]。逐一核对各相关州官方无人认领财产网站及全国数据库，列出所发现项、金额与持有方。在填写或提交任何申领表、上传任何身份证件之前，先暂停并向我展示即将录入的内容，并说明我需要准备哪些身份或核验文件。","category": "money","category_zh": "金融/理财","tools": ["ChatGPT Agent"],"agents": ["ChatGPT Agent"],"link": "","source_url": "https://x.com/S_Padival/status/2109389004311560338","source_platform": "x","source_platform_zh": "X","author": "","score": null,"date": "2026-10-17","addedAt": "2026-10-17","issue_date": "2026-10-17","issue_subject": "Catch a medication mistake and find $500 in unclaimed money","issue_subject_zh": "揪出用药错误，并找到 500 美元无人认领资金","accounts": null,"page": "https://agentusecases.ai/use-case/find-unclaimed-money-across-old-addresses"},{"id": "place-library-holds-for-books-you-need","title": "Place library holds for books you need","title_zh": "用智能体为需要的书预约图书馆借阅","summary": "An always-on agent picks titles for a request like chess books for a 6-year-old and books them via the county library site; the library emails when ready.","summary_zh": "一个常驻智能体按需求（如给 6 岁孩子找国际象棋书）挑选书目，并在县图书馆网站预约；书到后图书馆会发邮件通知。","what_they_did": "Eleanor Konik uses Muse, a hosted always-on agent, and has given it her library card login, which it stores in a locker it can't see and can only use on the right site. She sends one instruction, such as finding chess books for a bright 6-year-old. Muse picks the titles and requests them on the county website.","what_they_did_zh": "Eleanor Konik 使用托管型常驻智能体 Muse，并把图书馆卡登录交给它——凭证存在它看不到的保险箱里，只能在对应网站使用。她发一条指令，例如给聪明的 6 岁孩子找国际象棋书。Muse 挑选书目并在县图书馆网站提交预约。","how_it_went": "A few days later the county emailed that the books were ready, and she went to pick them up. The source gives no count of titles or any failures for this task.","how_it_went_zh": "几天后县图书馆发邮件说书已备好，她去取了书。来源未给出书目数量，也未提及本次任务失败。","worth_knowing": "Muse runs a model about six months behind the frontier, and Grok Bot won't store library or Costco logins. Hosted agents also cost compute on every scheduled wakeup, so audit your jobs.","worth_knowing_zh": "Muse 运行的模型大约落后前沿半年；Grok Bot 不会存储图书馆或 Costco 登录。托管智能体每次定时唤醒都会消耗算力，因此要审计你的任务。","prompt": "I want to borrow [number] books about [topic] for [reader, e.g. a 6-year-old] from [my library system's website]. Pick good titles that are available, and add them to my holds using my library account. Before you place any hold, show me the list and wait for my approval; you're done when I've confirmed and the holds are placed.","prompt_zh": "我想从 [我的图书馆系统网站] 为 [读者，例如 6 岁孩子] 借 [数量] 本关于 [主题] 的书。请挑选可借的合适书目，并用我的图书馆账户加入预约。在提交任何预约前，先把清单给我看并等待批准；我确认且预约提交完成后即可结束。","category": "life","category_zh": "生活","tools": ["Meta Muse"],"agents": ["Meta Muse"],"link": "","source_url": "https://www.eleanorkonik.com/p/muse-was-my-gateway-drug-to-grok","source_platform": "web","source_platform_zh": "网页","author": "Eleanor Konik","score": null,"date": "2026-10-17","addedAt": "2026-10-17","issue_date": "2026-10-17","issue_subject": "Catch a medication mistake and find $500 in unclaimed money","issue_subject_zh": "揪出用药错误，并找到 500 美元无人认领资金","accounts": null,"page": "https://agentusecases.ai/use-case/place-library-holds-for-books-you-need"},{"id": "review-ai-written-code-with-a-layered-agent-review-process","title": "Review AI-written code with a layered agent review process","title_zh": "用分层智能体流程审查 AI 编写的代码","summary": "Anthropic's Claude Code team rebuilt its code review around agents so Claude can write most of Claude Code's own code; merged pull requests more than doubled and the share that had to be reverted fell by over 40%.","summary_zh": "Anthropic 的 Claude Code 团队用智能体重构代码审查，使 Claude 能编写 Claude Code 自身大部分代码；合并的 PR 翻倍以上，需回滚的比例下降逾 40%。","what_they_did": "Claude verifies its own work by running tests, builds or screenshots, and a fresh-context subagent reviews the diff. Every PR then gets parallel bug-hunting agents, with other agents voting on each finding, plus a blocking security review and CI. A classifier sets human approval to none, one or two people by risk. Merge queue, flags and gradual release follow.","what_they_did_zh": "Claude 通过跑测试、构建或截图自检，并由全新上下文的子智能体审查 diff。每个 PR 再并行派出找 bug 的智能体，其他智能体对每条发现投票，另有阻断式安全审查与 CI。分类器按风险决定人类审批为无人、一人或两人。随后进入合并队列、功能开关与渐进发布。","how_it_went": "From June to September, merged PRs more than doubled and the share reverted fell by over 40 percent. Convergence changes cut mean reviews to pass from 2.08 to 1.32. Circuit breakers that tighten approval don't exist yet.","how_it_went_zh": "从 6 月到 9 月，合并 PR 数量翻倍以上，回滚比例下降逾 40%。收敛相关改动把通过审查的平均轮次从 2.08 降到 1.32。用于收紧审批的熔断机制尚不存在。","worth_knowing": "Agent author and agent reviewer can loop: one PR went over fifty overnight rounds, so cap re-review rounds (they use three) and re-review only the new diff.","worth_knowing_zh": "智能体作者与智能体审查者可能循环：有一个 PR 一夜超过五十轮，因此要限制复审轮数（他们用三轮），且只复审新增 diff。","prompt": "Review the pull request on branch [branch name] in this repo in layers. First check it against the intent described in [PR description or ticket link], then look for bugs, missing tests and security issues, and finally check style against our conventions in [file or doc]. Finish with a list of issues sorted by severity and a verdict on whether it is safe to merge; do not change any code or push anything.","prompt_zh": "请分层审查本仓库分支 [分支名] 上的拉取请求。先对照 [PR 说明或工单链接] 中的意图检查，再查找 bug、缺失测试与安全问题，最后按 [文件或文档] 中的规范检查风格。以按严重程度排序的问题列表和对是否可安全合并的结论结束；不要改任何代码或推送任何内容。","category": "software","category_zh": "软件开发","tools": ["Claude Code"],"agents": ["Claude Code"],"link": "https://claude.dev/blog/solving-code-review-at-anthropic/","source_url": "https://claude.dev/blog/solving-code-review-at-anthropic/","source_platform": "web","source_platform_zh": "网页","author": "Anthropic","score": null,"date": "2026-10-17","addedAt": "2026-10-17","issue_date": "2026-10-17","issue_subject": "Catch a medication mistake and find $500 in unclaimed money","issue_subject_zh": "揪出用药错误，并找到 500 美元无人认领资金","accounts": null,"page": "https://agentusecases.ai/use-case/review-ai-written-code-with-a-layered-agent-review-process"},{"id": "find-a-linux-vulnerability-hidden-for-23-years","title": "Find a Linux vulnerability hidden for 23 years","title_zh": "发现潜伏 23 年的 Linux 漏洞","summary": "Anthropic researcher Nicholas Carlini looped Claude Code over every file in the Linux kernel, and it found remotely exploitable bugs, including a heap overflow that had been sitting there since 2003.","summary_zh": "Anthropic 研究员 Nicholas Carlini 让 Claude Code 遍历 Linux 内核每个文件，发现了可远程利用的漏洞，包括一个自 2003 年就存在的堆溢出。","what_they_did": "Nicholas Carlini, a research scientist at Anthropic, ran a short script that looped over every file in the Linux kernel source. For each file, it told Claude Code it was in a CTF, hinted the bug was in that file, and asked it to write its most serious finding to an output directory. Humans then had to validate the results.","what_they_did_zh": "Anthropic 研究科学家 Nicholas Carlini 写了一段短脚本，遍历 Linux 内核源码的每个文件。对每个文件，它告诉 Claude Code 这是一场 CTF、漏洞就在该文件中，并要求把最严重发现写入输出目录。随后仍需人工验证结果。","how_it_went": "Claude Opus 4.6 found several remotely exploitable kernel bugs, including an NFS heap overflow from 2003. Five fixed or reported vulnerabilities are listed. Older models found only a small fraction of these.","how_it_went_zh": "Claude Opus 4.6 发现了多个可远程利用的内核漏洞，包括一个 2003 年的 NFS 堆溢出。已列出五处已修复或已报告的漏洞。更旧的模型只找到其中一小部分。","worth_knowing": "Validating the findings by hand is the bottleneck: Carlini has several hundred unreviewed crashes. He won't send maintainers unverified reports, so most findings are still unreported.","worth_knowing_zh": "人工验证发现是瓶颈：Carlini 手头有数百个未审查的崩溃。他不会向维护者发送未核实的报告，因此大多数发现仍未报告。","prompt": "In my local checkout of [open-source project or kernel subsystem] at [path], review the code in [directory or module] for memory-safety or logic bugs that could be security vulnerabilities. For each suspected issue, give the file, line, why it's a problem, and how to confirm it safely in a test environment. Finished means a ranked list of findings, and don't make changes or report anything publicly without asking me.","prompt_zh": "在我本地的 [开源项目或内核子系统] 检出目录 [路径] 中，审查 [目录或模块] 的代码，查找可能构成安全漏洞的内存安全或逻辑缺陷。对每个可疑问题给出文件、行号、为何有问题，以及如何在测试环境中安全确认。完成标准是按优先级排序的发现列表；未经我同意不要改代码或公开报告任何内容。","category": "science","category_zh": "科学","tools": ["Claude Code"],"agents": ["Claude Code"],"link": "https://mtlynch.io/claude-code-found-linux-vulnerability/","source_url": "https://mtlynch.io/claude-code-found-linux-vulnerability/","source_platform": "web","source_platform_zh": "网页","author": "Nicholas Carlini","score": null,"date": "2026-10-17","addedAt": "2026-10-17","issue_date": "2026-10-17","issue_subject": "Catch a medication mistake and find $500 in unclaimed money","issue_subject_zh": "揪出用药错误，并找到 500 美元无人认领资金","accounts": null,"page": "https://agentusecases.ai/use-case/find-a-linux-vulnerability-hidden-for-23-years"},{"id": "build-a-c-compiler-with-a-team-of-parallel-agents","title": "Build a C compiler with a team of parallel agents","title_zh": "用并行智能体团队构建 C 编译器","summary": "Anthropic's engineering write-up on tasking Opus 4.6 agent teams with building a C compiler.","summary_zh": "Anthropic 工程团队的文章，介绍让 Opus 4.6 智能体团队构建一个 C 编译器。","what_they_did": "Nicholas Carlini ran 16 Claude agents in an endless loop, each in its own Docker container, pushing to a shared git repo. Agents claimed tasks by writing lock files, merged each other's work, and had no orchestrator. Carlini's main work was building tests, CI, and a GCC-based oracle so agents could fix different kernel bugs in parallel.","what_they_did_zh": "Nicholas Carlini 让 16 个 Claude 智能体在无尽循环中运行，每个都在自己的 Docker 容器里，并推送到共享的 git 仓库。智能体通过写入锁文件认领任务、互相合并对方的工作，且没有编排器。Carlini 的主要工作是构建测试、CI，以及基于 GCC 的对照基准，让智能体可以检查自己的输出。","how_it_went": "About 2,000 sessions produced a 100,000-line Rust compiler that builds Linux 6.9 on x86, ARM and RISC-V and passes 99% of most test suites. It still calls GCC for 16-bit x86, its assembler and linker are buggy, and its output is inefficient.","how_it_went_zh": "大约 2000 次会话产出了约 10 万行的 Rust 编译器，可在 x86、ARM 和 RISC-V 上构建 Linux 6.9，并通过大多数测试套件约 99% 的用例。它在 16 位 x86 上仍会调用 GCC，汇编器和链接器有缺陷，生成的代码效率也不高。","worth_knowing": "It cost just under $20,000 in API fees over two weeks, and the quality of the test harness decided whether agents stayed on track. Run it in a container. Try it yourself with Claude Code","worth_knowing_zh": "两周 API 费用略低于 2 万美元，测试框架的质量决定了智能体能否保持正轨。请在容器中运行。","prompt": "I want to build a small [tool, e.g. a Markdown-to-HTML converter in Python] from scratch with a spec-first approach. First write a short spec and a test suite in this folder, then split the work into independent pieces and use sub-agents to implement them in parallel. Stop when all tests pass, and give me a summary of what each sub-agent built and any tests you had to skip.","prompt_zh": "我想用“规格优先”的方式从零做一个小工具（例如用 Python 写的 Markdown 转 HTML 转换器）。请先在本文件夹写一份简短规格和测试套件，再把工作拆成可独立完成的部分，并用子智能体并行实现。全部测试通过后停下，并告诉我还差什么。","category": "software","category_zh": "软件开发","tools": ["Claude"],"agents": ["Claude"],"link": "https://www.anthropic.com/engineering/building-c-compiler","source_url": "https://news.ycombinator.com/item?id=46903616","source_platform": "hn","source_platform_zh": "Hacker News","author": "modeless","score": 735,"date": "2026-02-05","addedAt": "2026-10-03","accounts": 2,"page": "https://agentusecases.ai/use-case/build-a-c-compiler-with-a-team-of-parallel-agents"},{"id": "run-a-solo-company-with-eight-agent-departments","title": "Run a solo company with eight agent departments","title_zh": "用八个智能体部门运营一人公司","summary": "A founder set up CEO, CFO, COO, lawyer, accountant, marketing, CTO, and improver agents that share memory and consult each other.","summary_zh": "一位创始人设置了 CEO、CFO、COO、律师、会计、市场、CTO 和改进者等智能体，它们共享记忆并相互咨询。","what_they_did": "The founder wrote eight agents as markdown files in a GitHub Copilot repo. They have MCP tools for X, dev.to, Sentry and scheduling, and all read and write one shared JSONL knowledge graph. A COO agent runs a morning standup and delegates. Agents consult each other by trigger table, for example Marketing sends product claims to the Lawyer. An Improver proposes upgrades as diffs, and the founder reviews them.","what_they_did_zh": "这位创始人在一个 GitHub Copilot 仓库里用 markdown 文件写了八个智能体。它们有用于 X、dev.to、Sentry 和日程的 MCP 工具，并共同读写一个共享的 JSONL 知识图谱。COO 智能体负责晨会并委派任务。智能体按触发表互相咨询，例如市场相关事项会问律师。","how_it_went": "After two months: €6.09 revenue, about €42/month infrastructure, 84+ tweets, 5 articles, under an hour a week on marketing, and no missed tax deadlines. Parallel writes corrupted the memory file until he forked the server.","how_it_went_zh": "两个月后：收入 €6.09，基础设施约每月 €42，发了 84+ 条推文、5 篇文章，每周营销不到一小时，没有错过报税截止日期。并行写入曾损坏记忆文件，直到他 fork 了服务器才解决。","worth_knowing": "Start with three agents (COO, Marketing, Accountant), not eight. Build the cross-agent review step in from the start. Building it took about 40 hours. Try it yourself with Claude Code","worth_knowing_zh": "先从三个智能体（COO、市场、会计）开始，不要一上来就上八个。从一开始就建好跨智能体审查步骤。搭建大约花了 40 小时。","prompt": "Help me set up a set of AI agent roles for my solo business, [business description], with roles like CEO, finance, legal, marketing, and tech. Create a project folder with one instruction file per role and a shared memory file they all read and update. Write a short note on how the roles should consult each other, and stop when the structure is ready for me to try one question.","prompt_zh": "帮我为我的一人公司（[业务描述]）设置一组 AI 智能体角色，包括 CEO、财务、法务、市场和技术等。请创建一个项目文件夹，每个角色一份说明文件，以及一份大家都会读写更新的共享记忆文件。再写一小段说明：各角色应如何相互咨询，以及我每天应检查什么。","category": "operations","category_zh": "运营","tools": ["GitHub Copilot"],"agents": ["GitHub Copilot"],"link": "","source_url": "https://dev.to/setas/i-run-a-solo-company-with-ai-agent-departments-50nf","source_platform": "devto","source_platform_zh": "DEV","author": "setas","score": 61,"date": "2026-03-03","addedAt": "2026-10-03","accounts": 1,"page": "https://agentusecases.ai/use-case/run-a-solo-company-with-eight-agent-departments"},{"id": "plan-a-family-trip-and-pre-fill-bookings","title": "Plan a family trip and pre-fill bookings","title_zh": "规划家庭旅行并预填预订信息","summary": "A reporter had ChatGPT Agent plan a 4-day San Diego trip: it searched flights, compared hotels, built an itinerary and pre-filled booking forms, stopping before purchase.","summary_zh": "一名记者让 ChatGPT Agent 规划 4 天圣地亚哥之旅：它搜索航班、比较酒店、制定行程并预填预订表单，在付款前停下。","what_they_did": "The reporter asked ChatGPT Agent to plan a 4-day family trip to San Diego from Newark, with pool hotels and activities for kids under 10, and to save an itinerary in Google Docs. The agent searched Google Flights, compared kid-friendly hotels, and listed attractions such as the zoo and LEGOLAND. It then wrote a daily itinerary with booking links and pre-filled the booking forms.","what_they_did_zh": "记者让 ChatGPT Agent 规划从纽瓦克出发、为期 4 天的圣地亚哥家庭游，要求酒店带泳池、适合 10 岁以下孩子，并把行程存到 Google Docs。智能体搜索了 Google Flights，比较了亲子友好酒店，并列出动物园、乐高乐园等景点。它还为选定方案预填了预订表单。","how_it_went": "The itinerary and comparisons came out well, and the reporter called it an incredible planning tool. The agent did not buy anything. She had to confirm bookings herself and says she wouldn't trust AI with that step.","how_it_went_zh": "行程和比价效果不错，记者称其为出色的规划工具。智能体没有实际购买任何东西。她必须自己确认预订，并表示不会把那一步交给 AI。","worth_knowing": "Her computer crashed before this task and she had to log back in and start over, so expect to restart now and then. Booking always needs your own approval. Try it yourself with ChatGPT Agent","worth_knowing_zh": "在做这项任务前她的电脑崩溃过，需要重新登录再来一遍，所以偶尔要准备重启。预订始终需要你自己批准。","prompt": "Plan a [number]-day family trip to [destination] for [number] people, [dates], with a budget of about [amount]. Search flights, compare three hotels, and build a day-by-day itinerary suited to [ages or interests]. Pre-fill the booking forms for my chosen options, but stop and show me everything before any payment or final submission.","prompt_zh": "请规划一次 [天数] 天、前往 [目的地]、[人数] 人、日期为 [日期]、预算大约 [金额] 的家庭旅行。搜索航班，比较三家酒店，并制定适合 [年龄或兴趣] 的逐日行程。为我选定的方案预填预订表单，但在购买前停下并把所有内容展示给我确认。","category": "travel","category_zh": "旅行","tools": ["ChatGPT Agent"],"agents": ["ChatGPT Agent"],"link": "","source_url": "https://tech.yahoo.com/ai/articles/tested-chatgpt-agent-week-good-115833661.html","source_platform": "web","source_platform_zh": "网页","author": "Yahoo Tech / Future","score": null,"date": "","addedAt": "2026-10-03","accounts": 2,"page": "https://agentusecases.ai/use-case/plan-a-family-trip-and-pre-fill-bookings"},{"id": "produce-a-track-in-ableton-live-by-talking","title": "Produce a track in Ableton Live by talking","title_zh": "通过对话在 Ableton Live 中制作音乐","summary": "An MCP server that lets Codex drive Ableton Live, used to write and mix a full song from chat messages.","summary_zh": "一个让 Codex 操控 Ableton Live 的 MCP 服务器，仅凭聊天消息完成了一整首歌的创作和混音。","what_they_did": "The MCP server lets Codex run Python inside Ableton Live's object model, plus built-in tools for common tasks. In the demo, the author sent chat prompts asking for an EDM song with macOS \"say\" vocals, chiptune sounds and 80s drum machines. Follow-up messages then asked for MIDI instruments, fills, dynamics, sidechain and a new element.","what_they_did_zh": "该 MCP 服务器让 Codex 在 Ableton Live 的对象模型中运行 Python，并提供常见任务的内置工具。演示中，作者用聊天提示要求做一首带 macOS “say” 人声、芯片音乐音色和 80 年代鼓机的 EDM。后续消息再要求加入 MIDI 乐器、过门、鼓点和混音调整。","how_it_went": "Complete live sets were built from scratch in a few minutes, and follow-up prompts refined them. The README doesn't give quality metrics. One follow-up reported that the new element had no notes, and a later one called it muddy.","how_it_went_zh": "完整的 Live 工程可在几分钟内从零建好，后续提示还能继续打磨。README 没有给出质量指标。有一次跟进反馈新元素没有音符，再后来有人说听起来浑浊。","worth_knowing": "Back up your Live Set first, because the MCP edits it directly and could corrupt it. The author has only tested it on Live Suite 12.3.8 on macOS. Try it yourself with Codex","worth_knowing_zh": "请先备份你的 Live Set，因为 MCP 会直接编辑它，可能造成损坏。作者仅在 macOS 上的 Live Suite 12.3.8 测过。","prompt": "Help me connect an MCP server for [Ableton Live or my music software] so you can control it from chat. Then create a [genre] track of about [length] with [instruments or mood], adding the drums, bass, and melody and doing a basic mix. Stop when the song plays through start to finish, and tell me what you changed before deleting or overwriting any existing project files.","prompt_zh": "帮我为 [Ableton Live 或我的音乐软件] 连接 MCP 服务器，以便你能从聊天中控制它。然后创作一首约 [时长] 的 [风格] 曲目，包含 [乐器或氛围]，加入鼓、贝斯和旋律并做基础混音。整首歌能从头播到尾后停下，并告诉我改了什么、我接下来该听哪里。","category": "creative","category_zh": "创意","tools": ["Codex","MCP"],"agents": ["Codex"],"link": "https://github.com/bschoepke/ableton-live-mcp","source_url": "https://news.ycombinator.com/item?id=47999656","source_platform": "hn","source_platform_zh": "Hacker News","author": "bschoepke","score": 123,"date": "2026-05-03","addedAt": "2026-10-03","accounts": 1,"page": "https://agentusecases.ai/use-case/produce-a-track-in-ableton-live-by-talking"},{"id": "get-a-second-opinion-on-an-mri","title": "Get a second opinion on an MRI","title_zh": "为 MRI 结果寻求第二意见","summary": "One person's account of using Claude Code to analyze their own MRI.","summary_zh": "一个人讲述用 Claude Code 分析自己 MRI 影像的经历。","what_they_did": "The author gave Claude Code (Opus 4.8, xhigh) a roughly 266 MB DICOM export of a shoulder MRI, let it install packages, and told it only the symptom (2–3 weeks of right shoulder pain). It planned and read the scans for about an hour. A second run used subagents to arbitrate between its report and the doctor's, with extra context supplied.","what_they_did_zh": "作者把大约 266 MB 的肩部 MRI DICOM 导出交给 Claude Code（Opus 4.8，xhigh），允许它安装软件包，并只告知症状（右肩疼痛 2–3 周）。它规划并阅读影像约一小时。第二次运行用子智能体在它的报告与放射科医生报告之间做仲裁。","how_it_went": "Opus found an intact tendon, while the doctor reported a Grade III partial tear. The arbitration sided with Opus at moderate-to-high confidence. The author still couldn't fully trust either and is continuing physical therapy.","how_it_went_zh": "Opus 认为肌腱完好，而医生报告为 III 级部分撕裂。仲裁以中高置信度站在 Opus 一边。作者仍无法完全信任任何一方，并继续接受物理治疗。","worth_knowing": "Each run took about an hour, and the author stresses the result is unverified and not medical advice. The AI disagreed sharply with the radiologist, so a third human opinion is still needed. Try it yourself with Claude Code","worth_knowing_zh": "每次运行约一小时，作者强调结果未经核实、并非医疗建议。AI 与放射科医生分歧很大，因此仍需要第三位人类医生的意见。","prompt": "I have MRI images and the radiologist's report at [folder path]. Walk through the report in plain language, point out what each finding means, and write a list of questions I should ask my doctor. Be clear about what you can't determine from images alone, and don't present anything as a diagnosis.","prompt_zh": "我在 [文件夹路径] 有 MRI 影像和放射科医生的报告。请用通俗语言解读报告，说明每项发现的含义，并列出我应向医生提出的问题。清楚标明仅凭影像无法判断的部分，不要把任何内容表述为诊断。","category": "life","category_zh": "生活","tools": ["Claude Code"],"agents": ["Claude Code"],"link": "https://antoine.fi/mri-analysis-using-claude-code-opus","source_url": "https://news.ycombinator.com/item?id=48708941","source_platform": "hn","source_platform_zh": "Hacker News","author": "engmarketer","score": 566,"date": "2026-06-28","addedAt": "2026-10-03","accounts": 1,"page": "https://agentusecases.ai/use-case/get-a-second-opinion-on-an-mri"}];
const CAT_ZH = {"operations": "运营", "software": "软件开发", "life": "生活", "growth": "增长", "money": "金融/理财", "travel": "旅行", "creative": "创意", "shopping": "购物", "research": "研究", "games": "游戏", "science": "科学"};
let cat = '';
let activeId = null;
const grid = document.getElementById('grid');
const meta = document.getElementById('meta');
const q = document.getElementById('q');
const sortEl = document.getElementById('sort');
const showEn = document.getElementById('showEn');
const backdrop = document.getElementById('backdrop');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');

function esc(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function filtered() {
  const term = q.value.trim().toLowerCase();
  let list = DATA.filter(it => !cat || it.category === cat);
  if (term) {
    list = list.filter(it => {
      const blob = [it.title_zh, it.title, it.summary_zh, it.summary, it.what_they_did_zh, it.category_zh, ...(it.tools||[])].join(' ').toLowerCase();
      return blob.includes(term);
    });
  }
  const mode = sortEl.value;
  list = list.slice().sort((a,b) => {
    if (mode === 'title') return (a.title_zh||'').localeCompare(b.title_zh||'', 'zh');
    const da = a.date || a.addedAt || '';
    const db = b.date || b.addedAt || '';
    return mode === 'date-asc' ? da.localeCompare(db) : db.localeCompare(da);
  });
  return list;
}
function render() {
  const list = filtered();
  meta.textContent = `显示 ${list.length} / ${DATA.length} 条` + (cat ? ` · 分类：${CAT_ZH[cat]||cat}` : '') + ' · 点击卡片查看详情';
  const enClass = showEn.checked ? ' show-en' : '';
  grid.innerHTML = list.map(it => {
    const tools = (it.tools||[]).map(t => `<span class="badge">${esc(t)}</span>`).join('');
    const date = it.date || it.addedAt || '';
    return `<article class="card${enClass}" tabindex="0" data-id="${esc(it.id)}" role="button" aria-label="打开详情：${esc(it.title_zh)}">
      <h2>${esc(it.title_zh)}</h2>
      <p class="en"><strong>EN</strong> ${esc(it.title)}</p>
      <div class="badges"><span class="badge cat">${esc(it.category_zh)}</span>${tools}${date?`<span class="badge">${esc(date)}</span>`:''}${it.issue_date?`<span class="badge">本期 ${esc(it.issue_date)}</span>`:''}</div>
      ${it.issue_subject_zh?`<p class="issue-line">本期邮件：${esc(it.issue_date)} · ${esc(it.issue_subject_zh)}</p>`:''}
      <p class="summary">${esc(it.summary_zh)}</p>
      <p class="hint">点击查看完整详情 →</p>
    </article>`;
  }).join('');
}
function openModal(id) {
  const it = DATA.find(x => x.id === id); if (!it) return;
  activeId = id;
  modalTitle.textContent = it.title_zh;
  const tools = (it.tools||[]).map(t => `<span class="badge">${esc(t)}</span>`).join('');
  const agents = (it.agents||[]).map(t => `<span class="badge">${esc(t)}</span>`).join('');
  const date = it.date || '未标注';
  const score = it.score != null ? ` · 评分 ${it.score}` : '';
  modalBody.innerHTML = `
    <div class="modal-actions">
      <label><input type="checkbox" id="modalEn"/> 显示英文原文</label>
    </div>
    <div class="badges"><span class="badge cat">${esc(it.category_zh)}（${esc(it.category)}）</span>${tools}${agents}</div>
    <h3>简介</h3>
    <p>${esc(it.summary_zh)}</p>
    <div class="en-block"><strong>EN summary</strong><br>${esc(it.summary)}</div>
    <h3>他们做了什么</h3>
    <p>${esc(it.what_they_did_zh)}</p>
    <div class="en-block"><strong>EN — What they did</strong><br>${esc(it.what_they_did)}</div>
    <h3>效果如何</h3>
    <p>${esc(it.how_it_went_zh)}</p>
    <div class="en-block"><strong>EN — How it went</strong><br>${esc(it.how_it_went)}</div>
    <h3>注意点</h3>
    <p>${esc(it.worth_knowing_zh)}</p>
    <div class="en-block"><strong>EN — Worth knowing</strong><br>${esc(it.worth_knowing)}</div>
    <h3>可复制提示词</h3>
    <pre>${esc(it.prompt_zh)}</pre>
    <div class="en-block"><strong>EN — Copy prompt</strong><br><pre style="margin:0;background:transparent;border:0;padding:0">${esc(it.prompt)}</pre></div>
    <h3>来源与日期</h3>
    <p>来源：${esc(it.source_platform_zh || it.source_platform)}${it.author?` · ${esc(it.author)}`:''}${score}<br>
    来源日期：${esc(date)} · 站点收录：${esc(it.addedAt || '—')}${it.accounts!=null?` · 提及账户数：${it.accounts}`:''}</p>
    ${it.issue_date?`<p>本期邮件：${esc(it.issue_date)} · ${esc(it.issue_subject_zh || it.issue_subject || '')}</p>`:''}
    <div class="links" style="margin-top:10px">
      ${it.link?`<a href="${esc(it.link)}" target="_blank" rel="noopener">原文 / Source</a>`:''}
      ${it.source_url?`<a href="${esc(it.source_url)}" target="_blank" rel="noopener">来源讨论</a>`:''}
      <a href="${esc(it.page)}" target="_blank" rel="noopener">agentusecases.ai 详情页</a>
    </div>`;
  document.getElementById('modalEn').checked = showEn.checked;
  document.getElementById('modalEn').onchange = (e) => modal.classList.toggle('show-en', e.target.checked);
  modal.classList.toggle('show-en', showEn.checked);
  backdrop.hidden = false; modal.hidden = false;
  requestAnimationFrame(() => { backdrop.classList.add('open'); modal.classList.add('open'); });
  document.body.classList.add('modal-open');
  document.getElementById('closeBtn').focus();
}
function closeModal() {
  backdrop.classList.remove('open'); modal.classList.remove('open');
  document.body.classList.remove('modal-open');
  setTimeout(() => { backdrop.hidden = true; modal.hidden = true; }, 200);
  activeId = null;
}
grid.addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  openModal(card.dataset.id);
});
grid.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) {
    e.preventDefault(); openModal(e.target.dataset.id);
  }
});
document.getElementById('closeBtn').onclick = closeModal;
backdrop.onclick = closeModal;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && activeId) closeModal(); });
document.getElementById('chips').addEventListener('click', e => {
  const btn = e.target.closest('.chip'); if (!btn) return;
  cat = btn.dataset.cat || '';
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === btn));
  render();
});
q.addEventListener('input', render);
sortEl.addEventListener('change', render);
showEn.addEventListener('change', () => {
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('show-en', showEn.checked));
});
render();
</script>
</body>
</html>
